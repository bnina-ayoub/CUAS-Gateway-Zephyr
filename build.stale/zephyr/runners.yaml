# Available runners configured by board.cmake.
runners:
- linkserver
- jlink
- pyocd

# Default flash runner if --runner is not given.
flash-runner: linkserver

# Default debug runner if --runner is not given.
debug-runner: linkserver

# Common runner configuration values.
config:
  board_dir: /home/bninaos/NXP_Projects/CAN_Node_Project/zephyr/boards/nxp/frdm_mcxa156
  # Build outputs:
  elf_file: zephyr.elf
  bin_file: zephyr.bin
  # Host tools:
  gdb: /home/bninaos/zephyr-sdk-1.0.1/gnu/arm-zephyr-eabi/bin/arm-zephyr-eabi-gdb-py
  openocd: /usr/bin/openocd
  openocd_search:
    - /home/bninaos/zephyr-sdk-1.0.1/hosttools/sysroots/x86_64-pokysdk-linux/usr/share/openocd/scripts

# Runner specific arguments
args:
  linkserver:
    - --dt-flash=y
    - --device=MCXA156:FRDM-MCXA156
  jlink:
    - --dt-flash=y
    - --device=MCXA156
  pyocd:
    - --dt-flash=y
    - --target=mcxA156
